apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: groot321/my-bday:a5b1a8070fd0b879370671ef6d42c341a1d8f8c4

          ports:
            - containerPort: 80