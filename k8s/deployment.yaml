apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: mydockerhubuser/myapp:be6bb90fee33ae7b74fd668157e5e7a43bd6c579

          ports:
            - containerPort: 80